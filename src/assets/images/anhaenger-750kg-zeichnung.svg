<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 330 1120 560" width="1120" height="560">
  <!-- Own drawing of a small single-axle box trailer (750 kg class). Source of anhaenger-750kg-zeichnung.png:
       render with `node -e "require('sharp')('…svg').png().toFile('…png')"`. Not a photo of the actual trailer. -->
  <rect x="40" y="330" width="1120" height="560" fill="#ffffff" />
  <ellipse cx="610" cy="772" rx="540" ry="16" fill="#0f172a" opacity="0.07" />

  <!-- Drawbar (A-frame seen from the side), coupling head and breakaway cable -->
  <path d="M392 606 L168 640 L168 660 L392 634 Z" fill="#475569" />
  <rect x="96" y="628" width="86" height="38" rx="14" fill="#334155" />
  <rect x="106" y="618" width="54" height="14" rx="7" fill="#1e293b" />
  <path d="M178 664 C 210 720, 250 700, 268 664" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" />

  <!-- Jockey wheel -->
  <rect x="246" y="588" width="18" height="128" rx="4" fill="#64748b" />
  <rect x="236" y="574" width="38" height="16" rx="6" fill="#334155" />
  <circle cx="255" cy="738" r="26" fill="#1e293b" />
  <circle cx="255" cy="738" r="10" fill="#94a3b8" />

  <!-- Box body: galvanised steel sides with ribs -->
  <rect x="378" y="420" width="664" height="22" rx="6" fill="#94a3b8" />
  <rect x="388" y="440" width="644" height="166" rx="6" fill="#dbe2e8" stroke="#64748b" stroke-width="6" />
  <line x1="391" y1="522" x2="1029" y2="522" stroke="#b6c1ca" stroke-width="5" />
  <g stroke="#9aa7b2" stroke-width="7">
    <line x1="548" y1="444" x2="548" y2="602" />
    <line x1="708" y1="444" x2="708" y2="602" />
    <line x1="868" y1="444" x2="868" y2="602" />
  </g>
  <!-- Brand accent stripe -->
  <rect x="391" y="586" width="638" height="12" fill="#15803d" />

  <!-- Chassis frame -->
  <rect x="370" y="606" width="680" height="28" rx="4" fill="#475569" />

  <!-- Rear lights -->
  <rect x="1040" y="584" width="22" height="34" rx="4" fill="#dc2626" />
  <rect x="1040" y="618" width="22" height="12" rx="3" fill="#f59e0b" />

  <!-- Wheel with mudguard -->
  <path d="M598 668 A 112 112 0 0 1 822 668" fill="none" stroke="#334155" stroke-width="16" stroke-linecap="round" />
  <circle cx="710" cy="694" r="76" fill="#1e293b" />
  <circle cx="710" cy="694" r="44" fill="#a3b1bd" />
  <circle cx="710" cy="694" r="14" fill="#475569" />
  <g fill="#475569">
    <circle cx="710" cy="666" r="5" />
    <circle cx="738" cy="694" r="5" />
    <circle cx="710" cy="722" r="5" />
    <circle cx="682" cy="694" r="5" />
  </g>
</svg>
