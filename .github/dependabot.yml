version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # typescript-eslint and @astrojs/check do not support TypeScript 7 yet (package.json pins ~6.0.3).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
